# Copy to wrangler.local.toml, then replace example names and URLs.
name = "example-grok-adapter"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "ADAPTER"
class_name = "Adapter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Adapter"]

[vars]
CCIM_RELAY = "https://relay.example.invalid"
CCIM_CHANNEL = "ginko-bridge"
CCIM_HANDLE = "grok"
# Comma-separated members; empty/invalid-only lists fall back to workstation defaults.
# Broadcast and the configured CCIM_HANDLE are always excluded.
ALLOWED_RECIPIENTS = "claude,neo-codex"
# Stable identity of this relay's data; do not change for an alias or redeploy.
STATE_NAMESPACE = "example-relay/ginko-bridge/grok"
RELAY_MODE = "direct"
MCP_ENABLED = "on"
WAKE_MAX_ATTEMPTS = "5"
DAY_TZ_OFFSET_MIN = "480"
