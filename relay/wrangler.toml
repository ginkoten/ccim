name = "ccim-relay"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true
routes = [{ pattern = "ccim.web3nomad.com", custom_domain = true }]

[[durable_objects.bindings]]
name = "CHANNEL"
class_name = "Channel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "Room", to = "Channel" }]
